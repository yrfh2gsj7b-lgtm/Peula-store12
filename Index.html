<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peula Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-animation"></div>

<header>
  <h1>PEULA STORE</h1>
  <p>Ultimate Gaming Subscription Shop</p>

  <div class="top-buttons">
    <button>Login</button>
    <button>Register</button>
    <button>Cart 🛒</button>
  </div>
</header>

<section class="products">

  <div class="card">
    <h2>Discord Nitro</h2>
    <p>1 Month Premium</p>
    <span>€5.99</span>
    <button>Buy Now</button>
  </div>

  <div class="card">
    <h2>Netflix Premium</h2>
    <p>Ultra HD Plan</p>
    <span>€8.99</span>
    <button>Buy Now</button>
  </div>

  <div class="card">
    <h2>Spotify Premium</h2>
    <p>No Ads Music</p>
    <span>€3.99</span>
    <button>Buy Now</button>
  </div>

  <div class="card vip">
    <h2>VIP Gaming Pack 👑</h2>
    <p>Exclusive Premium Access</p>
    <span>€14.99</span>
    <button>Get VIP</button>
  </div>

</section>

<section class="checkout">
  <h2>Checkout</h2>
  <input type="text" placeholder="Enter Username">
  <input type="email" placeholder="Enter Email">
  <button>Proceed Payment</button>
</section>

<section class="discord">
  <h2>Join Our Discord</h2>
  <button>Join Server</button>
</section>

<footer>
  <p>© 2026 Peula Store - Neon Gaming Theme</p>
</footer>

</body>
</html>
